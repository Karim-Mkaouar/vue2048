name: CI/CD Pipeline

on:
  push:
    branches: 
      - lab9
      - main
    paths-ignore:
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:
    inputs:
      run_lint:
        description: 'Run linter?'
        required: false
        default: 'true'
      run_typecheck:
        description: 'Run type-check?'
        required: false
        default: 'true'
      run_tests:
        description: 'Run tests?'
        required: false
        default: 'true'
  schedule:
    - cron: '0 8 * * 1' 

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: ${{ github.ref == 'refs/heads/main' && 7 || 1 }}
    

  lint:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.run_lint == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm lint

  type-check:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.run_typecheck == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm type-check

  test:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.run_tests == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm test

  deploy-qa:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: QA
      url: https://stapp-vue2048-qa.azurestaticapps.net/
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install -g @azure/static-web-apps-cli
      - run: pnpm build
      - run: swa deploy ./dist --app-name stapp-vue2048-qa --env preview --deployment-token ${{ secrets.QA_DEPLOYMENT_TOKEN }}

  deploy-prod:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: production
      url: https://stapp-vue2048-prod.azurestaticapps.net/
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install -g @azure/static-web-apps-cli
      - run: pnpm build
      - run: swa deploy ./dist --app-name stapp-vue2048-prod --env production --deployment-token ${{ secrets.PROD_DEPLOYMENT_TOKEN }}